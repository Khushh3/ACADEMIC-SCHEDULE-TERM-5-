<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Timetable upload</title>
<style>
:root { --paper:#f1f3ef; --surface:#fff; --ink:#1b2230; --ink-soft:#566074; --line:#cfd5cd; --brand:#23407a; --brand-ink:#fff; --bad:#c0262d; --ok:#2f7050; --warn:#9a6200; }
@media (prefers-color-scheme: dark) { :root { --paper:#12161d; --surface:#1a2029; --ink:#e9ecf1; --ink-soft:#9aa5b8; --line:#333c4a; --brand:#8fb0ff; --brand-ink:#0d1626; --bad:#ff6b72; --ok:#5fc08c; --warn:#e8b04f; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--paper); color:var(--ink); font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 56px; }
h1 { margin: 0 0 4px; font-size: 1.8rem; }
h2 { margin: 0 0 8px; font-size: 1.1rem; }
p { margin: 0 0 8px; }
.soft { color: var(--ink-soft); }
.card { background: var(--surface); border: 1.5px solid var(--ink); border-radius: 10px; padding: 16px; margin: 16px 0; }
.btn { border: 1.5px solid var(--ink); background: transparent; color: inherit; border-radius: 6px; padding: 8px 16px; font: inherit; font-weight: 600; cursor: pointer; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
.drop { display: block; cursor: pointer; border: 2px dashed var(--line); border-radius: 10px; padding: 28px 16px; text-align: center; }
.drop.over { border-color: var(--brand); background: color-mix(in srgb, var(--brand) 8%, transparent); }
.drop input { display: none; }
ul.plain { margin: 6px 0 0; padding-left: 18px; }
.msg-bad { color: var(--bad); font-weight: 600; }
.msg-ok { color: var(--ok); font-weight: 600; }
.msg-warn { color: var(--warn); }
.stats { display: flex; flex-wrap: wrap; gap: 8px 28px; margin: 8px 0 12px; }
.stats b { display: block; font-size: 1.4rem; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .82rem; min-width: 860px; }
th, td { border: 1px solid var(--line); padding: 4px 6px; vertical-align: top; text-align: left; }
thead th { background: var(--ink); color: var(--paper); }
td .c { margin-bottom: 3px; }
td .c small { display: block; color: var(--ink-soft); }
td .c em { font-style: normal; font-weight: 700; color: var(--ink-soft); }
td.note { font-weight: 700; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Timetable upload</h1>
  <p class="soft">Drop in the weekly PDF, check the preview against it, then download the updated data file and replace <code>data/weeks.js</code> on your host.</p>

  <section class="card">
    <h2>Published weeks</h2>
    <div id="current" class="soft">Loading</div>
  </section>

  <section class="card">
    <h2>New week</h2>
    <label class="drop" id="drop" for="file">
      <p><b>Choose the weekly timetable PDF</b></p>
      <p class="soft">or drop it here. The file stays in your browser.</p>
      <input id="file" type="file" accept="application/pdf,.pdf">
    </label>
    <p id="status" class="soft" role="status" aria-live="polite"></p>
  </section>

  <section class="card" id="result" hidden>
    <h2 id="rtitle"></h2>
    <div class="stats" id="stats"></div>
    <div id="warns"></div>
    <p class="soft">Preview of everything read from the PDF. Compare it with the PDF before publishing.</p>
    <div class="scroll"><table id="preview"></table></div>
    <p style="margin-top:14px"><button class="btn primary" id="download" type="button">Download weeks.js</button></p>
    <p class="soft" id="howto"></p>
  </section>
</div>

<script src="vendor/pdf.min.js"></script>
<script src="js/parser.js"></script>
<script src="data/weeks.js" onerror="window.__noData=true"></script>
<script>
(function () {
  "use strict";
  var EXISTING = window.TIMETABLE_DATA || { weeks: [] };

  function $(id) { return document.getElementById(id); }
  function el(tag, attrs) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) { if (k === "text") e.textContent = attrs[k]; else if (k === "class") e.className = attrs[k]; else e.setAttribute(k, attrs[k]); }
    for (var i = 2; i < arguments.length; i++) { var c = arguments[i]; if (c != null) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); }
    return e;
  }
  function clear(e) { while (e.firstChild) e.removeChild(e.firstChild); }

  /* ------------------------------------------------------------------
     5. UI
     ------------------------------------------------------------------ */
  var lastMerged = null;

  function renderCurrent() {
    var box = $("current"); clear(box);
    if (!EXISTING.weeks.length) { box.textContent = window.__noData ? "No data/weeks.js found next to this page. The download will contain only the new week." : "None yet."; return; }
    var ul = el("ul", { class: "plain" });
    EXISTING.weeks.forEach(function (w) { ul.appendChild(el("li", { text: w.label + ", " + w.start + " to " + w.end })); });
    box.appendChild(ul);
  }

  function renderResult(res) {
    var w = res.week;
    $("result").hidden = false;
    $("rtitle").textContent = w.label + ", " + w.start + " to " + w.end;
    var st = $("stats"); clear(st);
    var courses = {}; w.days.forEach(function (d) { d.classes.forEach(function (c) { courses[c.course + "-" + c.section] = 1; }); });
    [["Classes read", res.total], ["Course sections", Object.keys(courses).length], ["Days", w.days.length]].forEach(function (p) {
      st.appendChild(el("div", null, el("b", { text: String(p[1]) }), p[0]));
    });
    var wb = $("warns"); clear(wb);
    var replaces = EXISTING.weeks.some(function (x) { return x.id === w.id; });
    wb.appendChild(el("p", { class: replaces ? "msg-warn" : "msg-ok", text: replaces ? "This replaces the " + w.label + " already published." : "This adds a new week." }));
    if (res.warnings.length) {
      var ul = el("ul", { class: "plain msg-bad" });
      res.warnings.forEach(function (m) { ul.appendChild(el("li", { text: m })); });
      wb.appendChild(el("p", { class: "msg-bad", text: "Check these before publishing:" })); wb.appendChild(ul);
    } else wb.appendChild(el("p", { class: "msg-ok", text: "Every cell with a faculty and room was read (" + res.braces + " of " + res.braces + ")." }));
    var prevSlots = EXISTING.weeks.length ? EXISTING.weeks[EXISTING.weeks.length - 1].slots : null;
    if (prevSlots && prevSlots.join("|").replace(/\s/g, "") !== w.slots.join("|").replace(/\s/g, "")) wb.appendChild(el("p", { class: "msg-warn", text: "The time slots differ from the last published week." }));

    var t = $("preview"); clear(t);
    var hr = el("tr", null, el("th", { text: "Day" })); w.slots.forEach(function (s) { hr.appendChild(el("th", { text: s })); });
    t.appendChild(el("thead", null, hr));
    var tb = el("tbody");
    w.days.forEach(function (d) {
      var tr = el("tr", null, el("th", { text: d.name + " " + d.date.slice(5) }));
      if (d.note && !d.classes.length) tr.appendChild(el("td", { class: "note", colspan: "7", text: d.note }));
      else for (var c = 0; c < 7; c++) {
        var td = el("td");
        d.classes.filter(function (x) { return x.slot === c; }).forEach(function (x) {
          td.appendChild(el("div", { class: "c" }, el("em", { text: x.area === "ALL" ? "" : x.area + " " }), (x.common ? x.course : x.course + "-" + x.section) + "(" + x.session + ")", el("small", { text: x.faculty + "{" + x.room + "}" })));
        });
        tr.appendChild(td);
      }
      tb.appendChild(tr);
    });
    t.appendChild(tb);

    var merged = { weeks: EXISTING.weeks.filter(function (x) { return x.id !== w.id; }).concat([w]).sort(function (a, b) { return a.start < b.start ? -1 : 1; }) };
    lastMerged = "window.TIMETABLE_DATA = " + JSON.stringify(merged, null, 1) + ";\n";
    $("howto").textContent = "Then replace data/weeks.js on your host with the downloaded file. The student page picks it up on the next load.";
    window.__lastResult = { week: w, warnings: res.warnings, merged: merged };
  }

  async function handle(file) {
    var s = $("status"); s.className = "soft"; s.textContent = "Reading " + file.name + "...";
    $("result").hidden = true;
    try {
      var buf = await file.arrayBuffer();
      var res = await TimetableParser.parsePdf(new Uint8Array(buf), EXISTING);
      s.textContent = "Done. " + res.total + " classes read.";
      renderResult(res);
    } catch (e) {
      s.className = "msg-bad"; s.textContent = "Could not read this PDF. " + e.message;
      window.__lastError = e.message;
    }
  }

  $("file").addEventListener("change", function () { if (this.files[0]) handle(this.files[0]); });
  var drop = $("drop");
  ["dragenter", "dragover"].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add("over"); }); });
  ["dragleave", "drop"].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove("over"); }); });
  drop.addEventListener("drop", function (e) { var f = e.dataTransfer.files[0]; if (f) handle(f); });
  $("download").addEventListener("click", function () {
    if (!lastMerged) return;
    var a = el("a", { href: URL.createObjectURL(new Blob([lastMerged], { type: "text/javascript" })), download: "weeks.js" });
    document.body.appendChild(a); a.click(); a.remove();
  });
  renderCurrent();
})();
</script>
</body>
</html>
